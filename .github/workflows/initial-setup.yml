name: 公式マスター一括セットアップ検証

on:
  push:
    paths:
      - 'tools/setup.ts'
      - 'tools/setup.test.ts'
      - 'server/officialMasters.ts'
      - 'server/workspace.ts'
      - 'database/**'
      - 'package.json'
      - '.github/workflows/initial-setup.yml'
  pull_request:
    paths:
      - 'tools/setup.ts'
      - 'tools/setup.test.ts'
      - 'server/officialMasters.ts'
      - 'server/workspace.ts'
      - 'database/**'
      - 'package.json'
      - '.github/workflows/initial-setup.yml'

jobs:
  initial-setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run lint
      - run: npm run test:setup
      - run: npm run build
